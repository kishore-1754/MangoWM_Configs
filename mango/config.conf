# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=20
no_radius_when_single=0
focused_opacity=1
unfocused_opacity=0.75
dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=1.0
scroller_focus_center=1
scroller_prefer_center=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_master_factor=0.50
default_master_count=1
tag_num=10
smart_gaps=1
# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0
monocle_no_radius=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=10
gap_inner_vertical=10
gap_outer_horizontal=10
gap_outer_vertical=12
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4
root_color=0x201b14ff
border_color=0x444444ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0xc9b890ff
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# Tag Rules & Layout Presets
tag_rule=id:1,layout_name:fair
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile
tag_rule=id:0,layout_name:tile

# Window Rules (App Target Workspaces)
window_rule=tags:1,app_id:kitty
window_rule=tags:1,app_id:foot
window_rule=tags:2,app_id:firefox
window_rule=tags:2,app_id:firefox-default
window_rule=tags:3,app_id:zed
window_rule=tags:3,app_id:Zed
window_rule=tags:4,app_id:org.kde.dolphin
window_rule=tags:4,app_id:dolphin
window_rule=tags:5,app_id:libreoffice-writer
window_rule=tags:5,app_id:libreoffice-calc
window_rule=tags:5,app_id:libreoffice-impress
window_rule=tags:5,app_id:soffice.bin

# Key Bindings

# reload config
bind=SUPER+SHIFT,c,reload_config

# menu and terminal
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER,Return,spawn,kitty
# wallpaper
bind=SUPER,w,spawn,noctalia msg panel-toggle wallpaper
# Apps
bind=SUPER+SHIFT,b,spawn,firefox
bind=SUPER+SHIFT,t,spawn,zed
bind=SUPER,p,spawn,firefox --private-window
bind=SUPER+SHIFT,f,spawn,dolphin

# exit / session controls
bind=SUPER+SHIFT,e,quit
bind=SUPER+CTRL,Space,spawn,systemctl poweroff
bind=SUPER+CTRL,r,spawn,systemctl reboot
bind=SUPER+SHIFT,q,killclient,
bind=SUPER+CTRL,l,spawn,noctalia msg session lock
# bind=SUPER+CTRL,l,spawn,noctalia msg lock
# switch window focus (using vim keys and arrow keys)
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# move window
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

# switch window status / layout styles
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglefullscreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,g,toggleglobal,

# Layout Switchers (Mod + Ctrl + Letters)
bind=SUPER+CTRL,s,switch_layout,
bind=SUPER+CTRL,w,switch_layout,grid
bind=SUPER+CTRL,m,switch_layout,monocle
bind=SUPER+CTRL,d,switch_layout,dwindle
bind=SUPER+CTRL,t,switch_layout,tile

# Workspace / Tag Switch (Ctrl to view workspace, Super+Shift to move window)
bind=CTRL,1,view,1,0
bind=CTRL,2,view,2,0
bind=CTRL,3,view,3,0
bind=CTRL,4,view,4,0
bind=CTRL,5,view,5,0
bind=CTRL,6,view,6,0
bind=CTRL,7,view,7,0
bind=CTRL,8,view,8,0
bind=CTRL,9,view,9,0
bind=CTRL,0,view,0,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,0,0

# Cycle workspaces with wrap-around while skipping the unused spaces
bind=SUPER+CTRL,Right,viewtoright
bind=SUPER+CTRL,Left,viewtoleft

# Scratchpad
bind=SUPER+SHIFT,minus,toggle_scratchpad
bind=SUPER,minus,toggle_scratchpad

# Start noctalia services on boot
exec=noctalia

# Audio
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute

# Brightness
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down   

# Screenshots
bind=NONE,Print,spawn,noctalia msg screenshot-region   

# Network control center
bind=SUPER,N,spawn,noctalia msg panel-toggle control-center network

# Import theme from noctalia
source=~/.config/mango/noctalia.conf
