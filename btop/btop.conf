#? Config file for btop v.1.4.7

# --- Theme ---
color_theme = "noctalia"
theme_background = false
truecolor = true
force_tty = false
terminal_sync = true

# --- Layout ---
shown_boxes = "cpu mem net proc"
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default"
cpu_bottom = false

# --- Graphs ---
graph_symbol = "braille"
graph_symbol_cpu = "braille"
graph_symbol_gpu = "braille"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"

# --- CPU ---
update_ms = 1000
cpu_graph_upper = "Auto"
cpu_graph_lower = "Auto"
cpu_invert_lower = true
cpu_single_graph = false
show_uptime = true
show_cpu_watts = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = true
cpu_core_map = ""
temp_scale = "celsius"
show_cpu_freq = true
freq_mode = "average"
custom_cpu_name = ""

# --- GPU ---
show_gpu_info = "Auto"
shown_gpus = "nvidia amd intel apple"
nvml_measure_pcie_speeds = false
rsmi_measure_pcie_speeds = false
gpu_mirror_graph = true

# --- Processes ---
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = true
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false
proc_filter_kernel = false
proc_follow_detailed = true
proc_aggregate = false
keep_dead_proc_usage = false

# --- Memory / Disks ---
mem_graphs = true
mem_below_net = false
zfs_arc_cached = true
show_swap = true
swap_disk = true
show_disks = true
only_physical = true
use_fstab = false
zfs_hide_datasets = false
disk_free_priv = false
show_io_stat = true
io_mode = false
io_graph_combined = false
io_graph_speeds = ""
disks_filter = ""

# --- Network ---
swap_upload_download = false
net_download = 100
net_upload = 100
net_auto = true
net_sync = true
net_iface = ""
base_10_bitrate = "Auto"

# --- Battery ---
show_battery = true
selected_battery = "Auto"
show_battery_watts = true

# --- Misc ---
base_10_sizes = false
clock_format = "%X"
background_update = true
vim_keys = false
disable_mouse = false
rounded_corners = true
log_level = "WARNING"
save_config_on_exit = true   
